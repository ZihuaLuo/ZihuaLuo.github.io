<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Finance PhD Time-to-Degree Analysis overview</title>
  <desc id="desc">Five summary indicators and the adjusted time-to-degree trend across graduation cohorts from 2000 to 2025.</desc>
