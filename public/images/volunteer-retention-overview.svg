<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Volunteer retention research dashboard overview</title>
  <desc id="description">An illustrative dashboard layout with no private research figures or records.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#08111b"/><stop offset="1" stop-color="#10243a"/></linearGradient>
    <linearGradient id="bar" x2="0" y2="1"><stop stop-color="#2ad1c9"/><stop offset="1" stop-color="#176f83"/></linearGradient>
    <linearGradient id="barAlt" x2="0" y2="1"><stop stop-color="#ff9b71"/><stop offset="1" stop-color="#af5268"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="34"/></filter>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#edf4ff}
      .muted{fill:#9db2c7}.label{font-size:25px;font-weight:700;letter-spacing:3px}.title{font-size:61px;font-weight:750;letter-spacing:-2px}.small{font-size:24px}.panel{fill:#132132;stroke:#345169;stroke-width:2}.grid{stroke:#2c4255;stroke-width:2}.chip{fill:#173d4b;stroke:#2ad1c9;stroke-width:2}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1250" cy="150" r="230" fill="#ff7a59" opacity=".11" filter="url(#glow)"/>
  <circle cx="150" cy="120" r="230" fill="#2ad1c9" opacity=".1" filter="url(#glow)"/>
  <text x="82" y="92" class="label" fill="#2ad1c9">RESEARCH DASHBOARD / OVERVIEW</text>
  <text x="82" y="164" class="title">Volunteer Retention</text>
  <text x="83" y="208" class="small muted">Commitment · onboarding · participation · core volunteers</text>
  <rect x="1070" y="64" width="438" height="65" rx="30" class="chip"/>
  <text x="1105" y="106" font-size="25" font-weight="700" fill="#b5f7ed">ILLUSTRATIVE PREVIEW</text>

  <g>
    <rect x="82" y="255" width="340" height="153" rx="20" class="panel"/>
    <rect x="446" y="255" width="340" height="153" rx="20" class="panel"/>
    <rect x="810" y="255" width="340" height="153" rx="20" class="panel"/>
    <rect x="1174" y="255" width="340" height="153" rx="20" class="panel"/>
    <text x="110" y="307" class="small muted">COMMITMENT</text><text x="110" y="369" font-size="36" font-weight="700">DATA WITHHELD</text>
    <text x="474" y="307" class="small muted">ONBOARDING</text><text x="474" y="369" font-size="36" font-weight="700">DATA WITHHELD</text>
    <text x="838" y="307" class="small muted">CORE GROUP</text><text x="838" y="369" font-size="36" font-weight="700">DATA WITHHELD</text>
    <text x="1202" y="307" class="small muted">PARTICIPATION</text><text x="1202" y="369" font-size="36" font-weight="700">DATA WITHHELD</text>
  </g>

  <rect x="82" y="440" width="926" height="365" rx="24" class="panel"/>
  <text x="116" y="495" font-size="29" font-weight="700">Engagement patterns</text>
  <text x="116" y="529" class="small muted">Schematic chart shapes only</text>
  <path d="M128 751H960M128 676H960M128 601H960" class="grid"/>
  <g fill="url(#bar)">
    <rect x="171" y="642" width="64" height="109" rx="10"/><rect x="288" y="572" width="64" height="179" rx="10"/>
    <rect x="405" y="622" width="64" height="129" rx="10"/><rect x="522" y="554" width="64" height="197" rx="10"/>
    <rect x="639" y="599" width="64" height="152" rx="10"/><rect x="756" y="535" width="64" height="216" rx="10"/>
    <rect x="873" y="585" width="64" height="166" rx="10"/>
  </g>
  <g fill="url(#barAlt)" opacity=".85">
    <rect x="239" y="692" width="34" height="59" rx="8"/><rect x="356" y="653" width="34" height="98" rx="8"/>
    <rect x="473" y="678" width="34" height="73" rx="8"/><rect x="590" y="634" width="34" height="117" rx="8"/>
    <rect x="707" y="665" width="34" height="86" rx="8"/><rect x="824" y="622" width="34" height="129" rx="8"/>
  </g>

  <rect x="1032" y="440" width="482" height="365" rx="24" class="panel"/>
  <text x="1068" y="495" font-size="29" font-weight="700">Core volunteer profile</text>
  <text x="1068" y="529" class="small muted">Private figures omitted</text>
  <circle cx="1270" cy="660" r="113" fill="none" stroke="#2b4655" stroke-width="37"/>
  <circle cx="1270" cy="660" r="113" fill="none" stroke="#2ad1c9" stroke-width="37" stroke-dasharray="265 445" transform="rotate(-90 1270 660)"/>
  <circle cx="1270" cy="660" r="113" fill="none" stroke="#ff7a59" stroke-width="37" stroke-dasharray="135 575" stroke-dashoffset="-277" transform="rotate(-90 1270 660)"/>
  <text x="1198" y="668" font-size="28" font-weight="700">PRIVATE</text>
  <text x="1070" y="777" font-size="22" class="muted">No real records or metrics shown</text>
  <text x="82" y="860" class="small muted">Portfolio illustration only. The underlying dashboard is not published.</text>
</svg>
